name: Update Total GitHub Stars

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate total GitHub stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "LiYangHart-star-counter"
          }

          def get_repos(base_url):
              repos = []
              page = 1

              while True:
                  separator = "&" if "?" in base_url else "?"
                  url = f"{base_url}{separator}per_page=100&page={page}"

                  req = urllib.request.Request(url, headers=headers)

                  with urllib.request.urlopen(req) as response:
                      data = json.load(response)

                  repos.extend(data)

                  if len(data) < 100:
                      break

                  page += 1

              return repos

          personal_repos = get_repos(
              "https://api.github.com/users/LiYangHart/repos?type=owner"
          )

          organization_repos = get_repos(
              "https://api.github.com/orgs/Western-OC2-Lab/repos?type=public"
          )

          # Exclude forks so the metric represents repositories
          # created/maintained under your accounts rather than forked projects.
          personal_stars = sum(
              repo["stargazers_count"]
              for repo in personal_repos
              if not repo["fork"]
          )

          organization_stars = sum(
              repo["stargazers_count"]
              for repo in organization_repos
              if not repo["fork"]
          )

          total_stars = personal_stars + organization_stars

          print(f"Personal stars: {personal_stars}")
          print(f"Organization stars: {organization_stars}")
          print(f"Total stars: {total_stars}")

          badge = {
              "schemaVersion": 1,
              "label": "Total GitHub Stars",
              "message": f"{total_stars:,}",
              "color": "bf91f3"
          }

          with open("github-stars.json", "w") as f:
              json.dump(badge, f)
          PY

      - name: Commit updated star count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stars.json

          if git diff --cached --quiet; then
            echo "No star count change."
          else
            git commit -m "chore: update total GitHub stars"
            git push
          fi
