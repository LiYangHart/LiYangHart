name: Update GitHub Repository Impact

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate stars and generate SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          from pathlib import Path

          USERNAME = "LiYangHart"

          OC2_ORGANIZATION = "Western-OC2-Lab"
          ANTS_ORGANIZATION = "ANTS-OntarioTechU"
          SCHOLAR_ID = "XEfM7bIAAAAJ"


          # ============================================================
          # ORGANIZATION REPOSITORY SETTINGS
          # ============================================================
          #
          # None = count ALL public, non-fork repositories
          # in that organization.
          #
          # If some repositories in an organization are NOT yours,
          # replace None with an explicit set of your repository names.
          #
          # Example:
          #
          # OC2_REPO_ALLOWLIST = {
          #     "repo-name-1",
          #     "repo-name-2",
          # }
          #
          # ANTS_REPO_ALLOWLIST = {
          #     "repo-name-3",
          #     "repo-name-4",
          # }
          #
          # ============================================================

          OC2_REPO_ALLOWLIST = None

          ANTS_REPO_ALLOWLIST = None


          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "LiYangHart-GitHub-Star-Card",
          }


          def fetch_all_repositories(url):
              """
              Fetch all repositories returned by a GitHub REST API
              repository-list endpoint, including pagination.
              """

              repositories = []
              page = 1

              while True:
                  separator = "&" if "?" in url else "?"

                  paged_url = (
                      f"{url}{separator}"
                      f"per_page=100&page={page}"
                  )

                  request = urllib.request.Request(
                      paged_url,
                      headers=headers
                  )

                  with urllib.request.urlopen(request) as response:
                      data = json.load(response)

                  if not data:
                      break

                  repositories.extend(data)

                  if len(data) < 100:
                      break

                  page += 1

              return repositories


          def calculate_stars(repositories, allowlist=None):
              """
              Count stars from public, non-fork repositories.

              If allowlist is provided, only repositories whose names
              appear in the allowlist are counted.
              """

              repositories = [
                  repo
                  for repo in repositories
                  if not repo.get("fork", False)
                  and not repo.get("private", False)
              ]

              if allowlist is not None:
                  repositories = [
                      repo
                      for repo in repositories
                      if repo["name"] in allowlist
                  ]

              stars = sum(
                  repo.get("stargazers_count", 0)
                  for repo in repositories
              )

              return stars, repositories


          # ============================================================
          # 1. PERSONAL REPOSITORIES
          # ============================================================

          personal_repositories = fetch_all_repositories(
              f"https://api.github.com/users/{USERNAME}/repos"
              "?type=owner&sort=full_name"
          )

          personal_stars, personal_repositories = calculate_stars(
              personal_repositories
          )


          # ============================================================
          # 2. WESTERN OC2 LAB REPOSITORIES
          # ============================================================

          oc2_repositories = fetch_all_repositories(
              f"https://api.github.com/orgs/{OC2_ORGANIZATION}/repos"
              "?type=public&sort=full_name"
          )

          oc2_stars, oc2_repositories = calculate_stars(
              oc2_repositories,
              OC2_REPO_ALLOWLIST
          )


          # ============================================================
          # 3. ONTARIO TECH ANTS LAB REPOSITORIES
          # ============================================================

          ants_repositories = fetch_all_repositories(
              f"https://api.github.com/orgs/{ANTS_ORGANIZATION}/repos"
              "?type=public&sort=full_name"
          )

          ants_stars, ants_repositories = calculate_stars(
              ants_repositories,
              ANTS_REPO_ALLOWLIST
          )


          # ============================================================
          # TOTAL
          # ============================================================

          total_stars = (
              personal_stars
              + oc2_stars
              + ants_stars
          )


          # ============================================================
          # GOOGLE SCHOLAR CITATIONS
          # ============================================================

          def fetch_google_scholar_citations():
              """
              Retrieve the current Google Scholar citation count.

              Primary source: SerpApi Google Scholar Author API using the
              SERPAPI_KEY GitHub Actions secret.

              Fallback: the existing public Google Scholar badge endpoint.
              """

              serpapi_key = os.environ.get("SERPAPI_KEY", "").strip()

              # Primary: SerpApi Google Scholar Author API
              if serpapi_key:
                  try:
                      params = urllib.parse.urlencode({
                          "engine": "google_scholar_author",
                          "author_id": SCHOLAR_ID,
                          "hl": "en",
                          "api_key": serpapi_key,
                      })

                      url = f"https://serpapi.com/search.json?{params}"

                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "LiYangHart-GitHub-Star-Card"}
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:
                          data = json.load(response)

                      if data.get("error"):
                          raise RuntimeError(data["error"])

                      citation_table = (
                          data.get("cited_by", {})
                          .get("table", [])
                      )

                      for row in citation_table:
                          citations = row.get("citations")
                          if citations and "all" in citations:
                              return int(citations["all"])

                      raise ValueError(
                          "SerpApi response did not contain total citations."
                      )

                  except Exception as exc:
                      print(
                          "Warning: SerpApi Scholar lookup failed: "
                          f"{exc}"
                      )
              else:
                  print(
                      "Warning: SERPAPI_KEY is not configured; "
                      "trying the public Scholar badge endpoint."
                  )

              # Fallback: existing public badge endpoint
              url = (
                  "https://google-scholar-badge.vercel.app/"
                  f"citations?user={SCHOLAR_ID}"
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      data = json.load(response)

                  message = str(
                      data.get("message", "")
                  ).replace(",", "").strip()

                  if not message.isdigit():
                      raise ValueError(
                          f"Unexpected Scholar response: {data}"
                      )

                  return int(message)

              except Exception as exc:
                  print(
                      "Warning: Google Scholar citations could not "
                      f"be updated: {exc}"
                  )
                  return None


          scholar_citations = fetch_google_scholar_citations()


          # ============================================================
          # OUTPUT DETAILS TO GITHUB ACTION LOG
          # ============================================================

          print("=" * 60)

          print(
              f"Personal ({USERNAME}): "
              f"{personal_stars:,} stars "
              f"across {len(personal_repositories)} repositories"
          )

          print(
              f"OC2 Lab ({OC2_ORGANIZATION}): "
              f"{oc2_stars:,} stars "
              f"across {len(oc2_repositories)} repositories"
          )

          print(
              f"ANTS Lab ({ANTS_ORGANIZATION}): "
              f"{ants_stars:,} stars "
              f"across {len(ants_repositories)} repositories"
          )

          print("-" * 60)

          print(
              f"TOTAL: {total_stars:,} stars"
          )

          if scholar_citations is not None:
              print(
                  f"Google Scholar: {scholar_citations:,} citations"
              )

          print("=" * 60)


          # ============================================================
          # GENERATE SVG CARD
          # ============================================================

          svg = f'''<svg
            width="495"
            height="225"
            viewBox="0 0 495 225"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-labelledby="title desc"
          >

            <title id="title">
              GitHub Repository Impact
            </title>

            <desc id="desc">
              {total_stars:,} total GitHub stars:
              {personal_stars:,} personal stars,
              {oc2_stars:,} OC2 Lab stars,
              and {ants_stars:,} ANTS Lab stars.
            </desc>


            <style>

              .header {{
                font: 600 18px
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Helvetica,
                  Arial,
                  sans-serif;
                fill: #70a5fd;
              }}

              .total {{
                font: 700 28px
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Helvetica,
                  Arial,
                  sans-serif;
                fill: #bf91f3;
              }}

              .label {{
                font: 500 15px
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Helvetica,
                  Arial,
                  sans-serif;
                fill: #38bdae;
              }}

              .value {{
                font: 600 15px
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Helvetica,
                  Arial,
                  sans-serif;
                fill: #f8f8f2;
              }}

            </style>


            <!-- Background -->

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="224"
              rx="10"
              fill="#1a1b27"
              stroke="#30363d"
            />


            <!-- Header -->

            <text
              x="24"
              y="37"
              class="header"
            >★ GitHub Repository Impact</text>


            <!-- Total Stars -->

            <text
              x="247.5"
              y="91"
              text-anchor="middle"
              class="total"
            >{total_stars:,} Total Stars</text>


            <!-- Divider -->

            <line
              x1="24"
              y1="112"
              x2="471"
              y2="112"
              stroke="#30363d"
              stroke-width="1"
            />


            <!-- Personal -->

            <text
              x="32"
              y="143"
              class="label"
            >Personal</text>

            <text
              x="455"
              y="143"
              text-anchor="end"
              class="value"
            >{personal_stars:,}</text>


            <!-- OC2 Lab -->

            <text
              x="32"
              y="172"
              class="label"
            >OC2 Lab</text>

            <text
              x="455"
              y="172"
              text-anchor="end"
              class="value"
            >{oc2_stars:,}</text>


            <!-- ANTS Lab -->

            <text
              x="32"
              y="201"
              class="label"
            >ANTS Lab</text>

            <text
              x="455"
              y="201"
              text-anchor="end"
              class="value"
            >{ants_stars:,}</text>

          </svg>
          '''


          # ============================================================
          # SAVE SVG
          # ============================================================

          output_directory = Path("assets")
          output_directory.mkdir(exist_ok=True)

          output_file = (
              output_directory
              / "github-repository-impact.svg"
          )

          output_file.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Generated card: {output_file}"
          )


          # ============================================================
          # GENERATE GOOGLE SCHOLAR SVG CARD
          # ============================================================

          if scholar_citations is not None:
              scholar_svg = f'''<svg
                width="495"
                height="225"
                viewBox="0 0 495 225"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                role="img"
                aria-labelledby="scholar-title scholar-desc"
              >

                <title id="scholar-title">
                  Google Scholar Impact
                </title>

                <desc id="scholar-desc">
                  {scholar_citations:,} Google Scholar citations.
                </desc>

                <style>
                  .header {{
                    font: 600 18px
                      -apple-system,
                      BlinkMacSystemFont,
                      "Segoe UI",
                      Helvetica,
                      Arial,
                      sans-serif;
                    fill: #70a5fd;
                  }}

                  .total {{
                    font: 700 28px
                      -apple-system,
                      BlinkMacSystemFont,
                      "Segoe UI",
                      Helvetica,
                      Arial,
                      sans-serif;
                    fill: #bf91f3;
                  }}

                  .label {{
                    font: 500 15px
                      -apple-system,
                      BlinkMacSystemFont,
                      "Segoe UI",
                      Helvetica,
                      Arial,
                      sans-serif;
                    fill: #38bdae;
                  }}

                  .value {{
                    font: 600 15px
                      -apple-system,
                      BlinkMacSystemFont,
                      "Segoe UI",
                      Helvetica,
                      Arial,
                      sans-serif;
                    fill: #f8f8f2;
                  }}
                </style>

                <rect
                  x="0.5"
                  y="0.5"
                  width="494"
                  height="224"
                  rx="10"
                  fill="#1a1b27"
                  stroke="#30363d"
                />

                <text
                  x="24"
                  y="37"
                  class="header"
                >Google Scholar Impact</text>

                <text
                  x="247.5"
                  y="105"
                  text-anchor="middle"
                  class="total"
                >{scholar_citations:,} Citations</text>

                <line
                  x1="24"
                  y1="130"
                  x2="471"
                  y2="130"
                  stroke="#30363d"
                  stroke-width="1"
                />

                <text
                  x="32"
                  y="170"
                  class="label"
                >Profile</text>

                <text
                  x="455"
                  y="170"
                  text-anchor="end"
                  class="value"
                >Google Scholar</text>

                <text
                  x="32"
                  y="199"
                  class="label"
                >Researcher</text>

                <text
                  x="455"
                  y="199"
                  text-anchor="end"
                  class="value"
                >Li Yang</text>

              </svg>
              '''

              scholar_output_file = (
                  output_directory
                  / "google-scholar-impact.svg"
              )

              scholar_output_file.write_text(
                  scholar_svg,
                  encoding="utf-8"
              )

              print(
                  f"Generated Scholar card: {scholar_output_file}"
              )

          PY


      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-repository-impact.svg

          if [ -f assets/google-scholar-impact.svg ]; then
            git add assets/google-scholar-impact.svg
          fi

          if git diff --cached --quiet; then
            echo "GitHub star counts have not changed."
          else
            git commit \
              -m "chore: update GitHub repository impact"
            git push
          fi
