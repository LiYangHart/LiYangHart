<svg
  width="495"
  height="225"
  viewBox="0 0 495 225"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>

  <title id="title">
    GitHub Repository Impact
  </title>

  <desc id="desc">
    3,456 total GitHub stars:
    1,350 personal stars,
    2,103 OC2 Lab stars,
    and 3 ANTS Lab stars.
  </desc>


  <style>

    .header {
      font: 600 18px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      fill: #70a5fd;
    }

    .total {
      font: 700 28px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      fill: #bf91f3;
    }

    .label {
      font: 500 15px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      fill: #38bdae;
    }

    .value {
      font: 600 15px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      fill: #f8f8f2;
    }

  </style>


  <!-- Background -->

  <rect
    x="0.5"
    y="0.5"
    width="494"
    height="224"
    rx="10"
    fill="#1a1b27"
    stroke="#30363d"
  />


  <!-- Header -->

  <text
    x="24"
    y="37"
    class="header"
  >★ GitHub Repository Impact</text>


  <!-- Total Stars -->

  <text
    x="247.5"
    y="91"
    text-anchor="middle"
    class="total"
  >3,456 Total Stars</text>


  <!-- Divider -->

  <line
    x1="24"
    y1="112"
    x2="471"
    y2="112"
    stroke="#30363d"
    stroke-width="1"
  />


  <!-- Personal -->

  <text
    x="32"
    y="143"
    class="label"
  >Personal</text>

  <text
    x="455"
    y="143"
    text-anchor="end"
    class="value"
  >1,350</text>


  <!-- OC2 Lab -->

  <text
    x="32"
    y="172"
    class="label"
  >OC2 Lab</text>

  <text
    x="455"
    y="172"
    text-anchor="end"
    class="value"
  >2,103</text>


  <!-- ANTS Lab -->

  <text
    x="32"
    y="201"
    class="label"
  >ANTS Lab</text>

  <text
    x="455"
    y="201"
    text-anchor="end"
    class="value"
  >3</text>

</svg>
